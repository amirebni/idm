<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{color-scheme:dark}
  body{width:350px;margin:0;font:13px/1.4 "Segoe UI",Tahoma,Arial,sans-serif;background:#13151a;color:#e5e7eb}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #2a2f39}
  .logo{width:30px;height:30px;border-radius:9px;background:#2563eb;display:grid;place-items:center}
  h1{font-size:15px;margin:0;flex:1}
  .st{font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9}
  .dot{width:9px;height:9px;border-radius:50%;background:#6b7280}
  .dot.on{background:#4ade80}.dot.off{background:#f87171}
  section{padding:12px 16px;border-bottom:1px solid #2a2f39}
  h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8b93a1;margin:0 0 8px}
  .item{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;border-radius:10px;background:#1b1e25}
  .item .n{flex:1;min-width:0}.item .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .item .n small{color:#8b93a1}
  button{font:inherit;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;color:#fff;background:#2563eb}
  button:hover{filter:brightness(1.15)}
  .empty{color:#8b93a1;font-size:12px}
  label{display:flex;align-items:center;gap:8px;margin:6px 0}
  select{background:#1b1e25;color:#e5e7eb;border:1px solid #2a2f39;border-radius:6px;padding:3px 6px;font:inherit}
  .msg{font-size:12px;color:#4ade80;min-height:16px;margin-top:4px}
</style></head>
<body dir="auto">
<header>
  <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M10.5 3h3v8h4.2L12 17.2 6.3 11h4.2z"/><rect x="5" y="19" width="14" height="2" rx="1"/></svg></div>
  <h1>MyDM</h1>
  <div class="st"><span class="dot" id="dot"></span><span id="st">...</span></div>
</header>
<section><h2 id="hFound"></h2><div id="list"></div><div class="msg" id="msg"></div></section>
<section>
  <h2 id="hSet"></h2>
  <label><input type="checkbox" id="enabled"><span id="lEnabled"></span></label>
  <label><input type="checkbox" id="block"><span id="lBlock"></span></label>
  <label><span id="lLang"></span><select id="lang"><option value="fa">فارسی</option><option value="en">English</option></select></label>
</section>
<section><div class="empty" id="note"></div></section>
<script src="popup.js"></script>
</body></html>
