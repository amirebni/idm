<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{color-scheme:light;--bg:#f6f8fa;--surface:#fff;--fg:#202b33;--muted:#7b8793;--accent:#2f6df0;--border:#e7ebef;--good:#2f6df0;--error:#df5661;--on-accent:#fff}
  *{box-sizing:border-box;letter-spacing:0}
  body{width:370px;margin:0;font:13px/1.6 "Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:center;gap:12px;padding:20px;border-bottom:1px solid var(--border);background:var(--surface)}
  .logo{width:36px;height:36px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
  h1{font-size:19px;margin:0;flex:1;font-weight:650}
  .st{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--good)}.dot.off{background:var(--error)}
  section{padding:18px 20px;border-bottom:1px solid var(--border)}
  h2{font-size:11px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .item{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
  .item .n{flex:1;min-width:0}.item .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .item .n small,.empty{color:var(--muted);font-size:12px}
  button{font:inherit;border:0;border-radius:5px;padding:7px 12px;cursor:pointer;color:var(--on-accent);background:var(--accent)}
  button:hover{filter:brightness(.92)}
  button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  label{display:flex;align-items:center;gap:10px;margin:12px 0}
  input{accent-color:var(--accent)}
  select{background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:5px;padding:5px 8px;font:inherit}
  .msg{font-size:12px;color:var(--good);min-height:16px;margin-top:4px}
</style></head>
<body dir="auto">
<header>
  <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M10.5 3h3v8h4.2L12 17.2 6.3 11h4.2z"/><rect x="5" y="19" width="14" height="2" rx="1"/></svg></div>
  <h1>MyDM</h1>
  <div class="st"><span class="dot" id="dot"></span><span id="st">...</span></div>
</header>
<section><h2 id="hFound"></h2><div id="list"></div><div class="msg" id="msg"></div></section>
<section>
  <h2 id="hSet"></h2>
  <label><input type="checkbox" id="enabled"><span id="lEnabled"></span></label>
  <label><input type="checkbox" id="block"><span id="lBlock"></span></label>
  <label><span id="lLang"></span><select id="lang"><option value="fa">فارسی</option><option value="en">English</option></select></label>
</section>
<section><div class="empty" id="note"></div></section>
<script src="popup.js"></script>
</body></html>
