name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "requests[socks]" tkinterdnd2 pyinstaller
      - run: pyinstaller --noconfirm --noconsole --onefile --name MyDM --collect-all tkinterdnd2 --hidden-import socks --hidden-import urllib3.contrib.socks dm.py
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: MyDM-Setup
          path: Output/MyDM_Setup.exe
